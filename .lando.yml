name: slidekick

services:
  app:
    api: 3
    type: lando

    services:
      build:
        context: .
        dockerfile: docker/dev/Dockerfile

      # Lando sets its own entrypoint, which clears the image's CMD, so the
      # keep-alive command has to be declared here. PYTHONPATH is what makes
      # `import slidekick` resolve to src/slidekick without an install step.
      command: sleep infinity
      environment:
        PYTHONPATH: /app/src

tooling:
  shell:
    service: app
    cmd: bash
    dir: /app

  test:
    service: app
    cmd: python -m pytest
    dir: /app

  lint:
    service: app
    cmd: ruff check .
    dir: /app

  format:
    service: app
    cmd: ruff format .
    dir: /app

  python:
    service: app
    cmd: python
    dir: /app

  npm:
    service: app
    cmd: npm
    dir: /app/frontend

  frontend-dev:
    service: app
    cmd: npm run dev -- --host 0.0.0.0
    dir: /app/frontend

  frontend-test:
    service: app
    cmd: npm run test
    dir: /app/frontend

  frontend-lint:
    service: app
    cmd: npm run lint
    dir: /app/frontend

  # Regenerate requirements.lock from requirements.in. Run this inside the
  # container so the resolution matches the image's Python, then rebuild.
  #
  # The flags must stay byte-identical to the command recorded in the header of
  # requirements.lock — pip-compile writes its own invocation into that header,
  # so any difference shows up as a diff even when the resolved versions match.
  lock:
    service: app
    cmd: pip-compile --no-index --output-file=requirements.lock --strip-extras requirements.in
    dir: /app