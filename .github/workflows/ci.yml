name: SlideKick CI

on:
  # Primary quality gate: run CI whenever code is proposed for a long-lived
  # branch. The run tests the PR merged into its target.
  pull_request:
    branches: [production, develop]

  # Every branch, so feature branches get feedback before a PR is opened, and
  # production/develop are verified in their final merged state.
  push:
    branches: ["**"]

  # Lets the team run CI manually from the Actions tab.
  workflow_dispatch:

# If new commits are pushed to the same branch or PR, cancel the older run.
concurrency:
  group: slidekick-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Python and Node versions the project targets, kept in step with
# .python-version and .nvmrc. tests/environment checks that these stay in sync.
env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  quality:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Same as scripts/verify.sh, so `import slidekick` resolves to src/slidekick.
    env:
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      # Same lock file developers install into their .venv.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      # CI mode skips the frontend checks; the frontend job covers those.
      - name: Run environment doctor
        run: python scripts/check_env.py --ci

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

      # Version drift between .python-version, .nvmrc, ci.yml, and
      # requirements.lock.
      - name: Run environment tests
        run: python -m pytest -q tests/environment

      - name: Run unit tests
        run: python -m pytest -q tests/unit

  gesture-smoke-test:
    name: Gesture Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      # Keep smoke tests lightweight:
      # - model loads
      # - sample input can be processed
      # - gesture result has the expected structure
      # - command mapping works (covered today via the presentation adapter)
      #
      # Do not retrain the model here. Runners have no webcam or display, so
      # use prerecorded samples and the fake pyautogui in tests/conftest.py.
      - name: Run smoke tests
        run: python -m pytest -q tests/smoke

  frontend:
    name: Frontend Lint, Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      # Includes `tsc -b`, so this is also the type check.
      - name: Build
        run: npm run build

      # Makes the production bundle downloadable from the run's Summary
      # page, and retrievable by a later job or workflow via
      # actions/download-artifact. Kept for 14 days, then GitHub deletes it.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 14

  # ---------------------------------------------------------------------------
  # SECURITY CHECKS
  # ---------------------------------------------------------------------------

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for Gitleaks to scan commit history

      - name: Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Security Tools (pip-audit & bandit)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit bandit

      - name: Scan Python dependencies (pip-audit)
        run: python -m pip_audit -r requirements.lock --desc on

      - name: SAST - Python Source Code (Bandit)
        run: python -m bandit -r src/

      - name: Set up Node for Frontend checks
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Scan Frontend dependencies (npm audit)
        working-directory: frontend
        run: npm audit || true
  # ---------------------------------------------------------------------------
  # OPTIONAL PRODUCTION-ONLY CHECKS
  #
  # Slower checks can be added here later. Restricting them to pushes on
  # production keeps them from slowing down every branch and pull request.
  # ---------------------------------------------------------------------------

