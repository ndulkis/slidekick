name: SlideKick CI

on:
  pull_request:
    branches: [production, develop]
  # Every branch, so feature branches get checked before a PR is opened.
  push:
    branches: ["**"]
  workflow_dispatch:

# Prevent duplicate runs on the same branch/PR.
concurrency:
  group: slidekick-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Keep these in step with docker/dev/Dockerfile so CI matches `lando` locally.
env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  python:
    name: Python Lint and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      # Same lock file the Docker image installs.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

      # Scoped to tests/ so pytest doesn't collect manual_test.py, which drives
      # the real keyboard. Exit code 5 means "no tests collected" — allowed
      # until the first tests land in tests/.
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests || [ $? -eq 5 ]

  frontend:
    name: Frontend Lint, Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      # Includes `tsc -b`, so this is also the type check.
      - name: Build
        run: npm run build

  container-build:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Confirms a clean environment can build the image Lando uses, which
      # guards against "works on my machine" drift.
      - name: Build SlideKick dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dev/Dockerfile
          push: false
          tags: slidekick-dev:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Planned jobs — enable once the pieces they exercise exist:
  #
  # gesture-smoke-test: load the committed model from models/, run it over a
  #   few prerecorded clips, and assert output shape/classes. Never retrain in
  #   CI. Something like: python -m pytest -q tests/test_gesture_smoke.py
  #
  # integration: run inside the built image with mocked presentation adapters
  #   and prerecorded camera data. Hosted runners have no webcam or display, so
  #   anything touching pyautogui must be mocked.
  #
  # model-evaluation (production only): accuracy / false-positive rate /
  #   latency on a small deterministic dataset, e.g.
  #   python scripts/evaluate_model.py --dataset tests/data/ci_validation
