    <rect x="49" y="58" width="62" height="44" rx="16" fill="#070b19" stroke="#001a4d" stroke-width="3"/>
    <g class="eyes"><path d="M61 79q6-9 12 0M87 79q6-9 12 0" fill="none" stroke="#fe0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <path d="M72 87Q80 90 88 87C88 98 72 98 72 87Z" fill="#f70"/>
