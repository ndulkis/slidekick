.head{animation:hop 3s ease-out infinite}
@keyframes hop{0%,22%,100%{transform:translateY(0)}8%{transform:translateY(-7px)}15%{transform:translateY(1px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.z,.c{opacity:1}}
</style>
