<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" role="img" aria-label="Done">
<title>Done</title>
<style>
.badge{transform-box:fill-box;transform-origin:center;animation:pop 3s ease-out infinite}
