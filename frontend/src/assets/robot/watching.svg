<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" role="img" aria-label="Watching for gestures">
<title>Watching for gestures</title>
<style>
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
.head{animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-2px)}to{transform:translateY(2px)}}
.look{animation:look 5s ease-in-out infinite}
@keyframes look{0%,30%,100%{transform:translateX(0)}38%,52%{transform:translateX(-4px)}60%,74%{transform:translateX(4px)}}
.wave{animation:wave 1.8s ease-out infinite}.w2{animation-delay:.35s}
@keyframes wave{0%,100%{opacity:.15}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.z,.c{opacity:1}}
</style>
  <g fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round">
    <path class="wave" d="M19 64q-6 16 0 32M141 64q6 16 0 32"/>
    <path class="wave w2" d="M9 56q-9 24 0 48M151 56q9 24 0 48" stroke="#06f"/>
  </g>
  <g class="head">
    <ellipse cx="34" cy="80" rx="8" ry="15" fill="#fff" stroke="#001a4d" stroke-width="3"/>
    <ellipse cx="126" cy="80" rx="8" ry="15" fill="#fff" stroke="#001a4d" stroke-width="3"/>
    <rect x="38" y="48" width="84" height="64" rx="28" fill="#08f" stroke="#001a4d" stroke-width="3.5"/>
    <rect x="49" y="58" width="62" height="44" rx="16" fill="#070b19" stroke="#001a4d" stroke-width="3"/>
    <g class="eyes"><g class="look"><g class="blink"><ellipse cx="67" cy="76" rx="6" ry="9" fill="#fe0"/><ellipse cx="93" cy="76" rx="6" ry="9" fill="#fe0"/></g></g></g>
    <path d="M74 89Q80 91 86 89C86 96 74 96 74 89Z" fill="#f70"/>
  </g>
</svg>
