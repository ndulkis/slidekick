<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" role="img" aria-label="Camera off">
<title>Camera off</title>
<style>
.head{transform-origin:80px 112px;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
.z{animation:z 3.2s ease-out infinite;opacity:0}.z2{animation-delay:1s}.z3{animation-delay:2s}
@keyframes z{0%{transform:translate(0,8px);opacity:0}30%{opacity:1}100%{transform:translate(8px,-14px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.z,.c{opacity:1}}
</style>
  <g class="head">
    <ellipse cx="34" cy="80" rx="8" ry="15" fill="#fff" stroke="#001a4d" stroke-width="3"/>
    <ellipse cx="126" cy="80" rx="8" ry="15" fill="#fff" stroke="#001a4d" stroke-width="3"/>
    <rect x="38" y="48" width="84" height="64" rx="28" fill="#08f" stroke="#001a4d" stroke-width="3.5"/>
    <rect x="49" y="58" width="62" height="44" rx="16" fill="#070b19" stroke="#001a4d" stroke-width="3"/>
    <g class="eyes"><path d="M61 76q6 6 12 0M87 76q6 6 12 0" fill="none" stroke="#fe0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <ellipse cx="80" cy="92" rx="3.5" ry="3" fill="#f70"/>
  </g>
  <g fill="none" stroke="#00e5ff" stroke-linecap="round" stroke-linejoin="round">
    <path class="z" d="M112 40h7l-7 8h7" stroke-width="2.5"/>
    <path class="z z2" d="M124 26h9l-9 10h9" stroke-width="3"/>
    <path class="z z3" d="M138 10h11l-11 12h11" stroke-width="3.5"/>
  </g>
</svg>
